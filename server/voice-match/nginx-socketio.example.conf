# 将下列片段并入你已启用 HTTPS（443）的 server { ... } 内，
# 使前端页面（https://www.example.com）与 Socket.IO 同源，避免 mixed content / ws 被拦截。
#
# Node 语聊服务监听：127.0.0.1:3847
#
# 前端 Flutter Web 无需再写 http://IP:3847；代码在未配置 VOICE_SIGNAL_URL 时将使用 Uri.base.origin。

location /socket.io/ {
    proxy_pass http://127.0.0.1:3847;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# 可选：健康检查（浏览器访问 https://域名/voice-health）
location = /voice-health {
    proxy_pass http://127.0.0.1:3847/health;
    proxy_set_header Host $host;
}
